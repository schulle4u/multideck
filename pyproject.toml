[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multideck-audio-player"
dynamic = ["version"]
description = "Accessible cross-platform audio player for simultaneous playback of multiple audio sources"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Steffen Schultz", email = "steffenschultz@mailbox.org" },
]
keywords = [
    "accessibility",
    "audio",
    "mixer",
    "player",
    "screenreader",
    "streaming",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "configparser>=7.2.0",
    "numpy>=2.5.3",
    "pedalboard==0.9.23",
    "prismatoid>=0.18.2",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "wxPython>=4.3.1",
    "m45wxcontrols @ https://github.com/schulle4u/m45wxcontrols/releases/download/v0.3.0/m45wxcontrols-0.3.0-py3-none-any.whl",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.22.3",
    "markdown>=3.10.3",
    "pillow>=12.3.0",
]

[project.scripts]
multideck-cli = "cli:main"

[project.gui-scripts]
multideck-gui = "main:main"

[project.urls]
"Bug Reports" = "https://github.com/schulle4u/multideck/issues"
Homepage = "https://m45.dev"
Source = "https://github.com/schulle4u/multideck"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.hatch.version]
path = "src/config/defaults.py"
pattern = "APP_VERSION = ['\"](?P<version>[^'\"]+)['\"]"

[tool.hatch.metadata]
allow-direct-references = true
